name: npm installer

on:
  pull_request:
    paths:
      - 'npm/**'
      - 'scripts/check-npm-install.mjs'
      - 'scripts/tests/npm-*.test.mjs'
      - '.github/workflows/npm-installer.yml'
  push:
    branches: [main]
    paths:
      - 'npm/**'
      - 'scripts/check-npm-install.mjs'
      - 'scripts/tests/npm-*.test.mjs'
      - '.github/workflows/npm-installer.yml'

permissions:
  contents: read

jobs:
  native-install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check installer error paths
        shell: bash
        run: node --test scripts/tests/npm-*.test.mjs
      - name: Pack npm installer
        run: npm pack ./npm --ignore-scripts
      - name: Check Windows Shell Unicode targets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'npm-installer-shell-应用 smoke'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $exe = Join-Path $folder 'Codex Account Switcher.exe'
          Copy-Item "$env:WINDIR\System32\notepad.exe" $exe
          Add-Type -Path ./npm/lib/windows-shortcut.cs
          $link = Join-Path $folder 'test.lnk'
          [SwitcherShortcut]::Write($exe, $link)
          if ([SwitcherShortcut]::Read($link) -ne $exe) { throw 'Unicode shortcut target differs' }
      - name: Check whether this fork has a published release
        id: fork_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No fork Release yet; real installer smoke is skipped."
          fi
      - name: Install global tarball through postinstall
        if: steps.fork_release.outputs.available == 'true'
        env:
          CODEX_ACCOUNT_SWITCHER_INSTALL_DIR: ${{ runner.temp }}/npm-installer/应用 smoke
        run: npm install -g ./sirious0911-codex-account-switcher-0.2.1.tgz --prefix "${{ runner.temp }}/npm-installer-cli" --foreground-scripts
      - name: Verify real release update and uninstall
        if: steps.fork_release.outputs.available == 'true'
        env:
          CODEX_ACCOUNT_SWITCHER_INSTALL_DIR: ${{ runner.temp }}/npm-installer/应用 smoke
        run: node scripts/check-npm-install.mjs
