name: P201 isolated Windows Swift scope
on:
  push:
    branches: [ci/p201-swift-scope-20261127]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Build existing isolated RPC regression fixture
        shell: pwsh
        run: |
          dotnet build windows/CodexAccountSwitcher.Checks -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Legacy fixture build failed' }
      - name: Verify exact source archive and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $pwd 'ci-input/P204-CI-source-only.zip'
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -cne 'cdde0656393c2aa78c70993935d390ebe3b6ce44dab686af6c31a0f8a22aaeeb') { throw 'Wrong source archive' }
          $env:SWITCHER_TEST_RPC_EXE = (Resolve-Path 'windows/CodexAccountSwitcher.Checks/bin/Release/net10.0-windows/CodexAccountSwitcher.Checks.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'p201-verified-source'
          if (Test-Path -LiteralPath $target) { throw 'Unexpected existing source folder' }
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          & (Join-Path $target 'run-build.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed' }
          Push-Location (Join-Path $target 'core')
          try {
            $bin = swift build -c release --show-bin-path
            if ($LASTEXITCODE -ne 0) { throw 'Host path lookup failed' }
            $result = Join-Path $env:RUNNER_TEMP 'p201-result'
            New-Item -ItemType Directory -Path $result | Out-Null
            $stage = Join-Path $env:RUNNER_TEMP 'p202-swift-runtime'
            New-Item -ItemType Directory -Path $stage | Out-Null
            Copy-Item -LiteralPath (Join-Path $bin 'SwitcherHost.exe') -Destination $stage
            $targetInfo = (swift -print-target-info | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0) { throw 'Swift target info failed' }
            $runtime = $targetInfo.paths.runtimeLibraryPaths | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'swiftCore.dll') } | Select-Object -First 1
            if (-not $runtime -or -not (Test-Path -LiteralPath (Join-Path $runtime 'Foundation.dll'))) { throw 'Matching Swift runtime unavailable' }
            Get-ChildItem -LiteralPath $runtime -Filter '*.dll' -File | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage }
            Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'windows/licenses') -Filter '*.txt' -File | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $stage }
            $entries = @(Get-ChildItem -LiteralPath $stage -File | Sort-Object Name | ForEach-Object {
              [pscustomobject]@{path=$_.Name;bytes=$_.Length;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
            })
            ConvertTo-Json -InputObject $entries -Depth 4 | Set-Content -Encoding utf8 (Join-Path $result 'runtime-manifest.json')
            $zip = Join-Path $result 'SwiftRuntime.zip'
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [IO.Compression.ZipFile]::CreateFromDirectory($stage,$zip)
            $sha = (Get-FileHash -LiteralPath (Join-Path $stage 'SwitcherHost.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            $zipSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            $manifestSha = (Get-FileHash -LiteralPath (Join-Path $result 'runtime-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            @("source_commit=$env:GITHUB_SHA","source_archive_sha256=$hash","host_sha256=$sha","runtime_zip_sha256=$zipSha","runtime_manifest_sha256=$manifestSha") | Set-Content -Encoding utf8 (Join-Path $result 'provenance.txt')
            # Test packaged host without Swift compiler directories in PATH.
            $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $stage 'SwitcherHost.exe'))
            $start.UseShellExecute = $false
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.Environment['PATH'] = "$env:SystemRoot\\System32;$env:SystemRoot"
            $empty = Join-Path $env:RUNNER_TEMP 'p202-empty-host-home'
            New-Item -ItemType Directory -Path $empty | Out-Null
            $start.Environment['CODEX_HOME'] = $empty
            $start.Environment['CODEX_SWITCHER_DATA_HOME'] = $empty
            $process = [Diagnostics.Process]::Start($start)
            try {
              $stdout = $process.StandardOutput.ReadToEndAsync()
              $stderr = $process.StandardError.ReadToEndAsync()
              $process.StandardInput.Close()
              if (-not $process.WaitForExit(15000)) { $process.Kill($true); throw 'Packaged host EOF timeout' }
              if ($process.ExitCode -ne 0) { throw 'Packaged host failed to exit cleanly' }
              if (-not $stdout.Wait(3000) -or -not $stderr.Wait(3000)) { throw 'Packaged host pipe closure unconfirmed' }
              Write-Host 'PACKAGED_HOST_EMPTY_STDIN_EXIT_PASS'
            } finally { $process.Dispose() }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@v4
        with:
          name: p204-unsigned-swift-runtime
          path: ${{ runner.temp }}/p201-result/
          if-no-files-found: error
          retention-days: 7
