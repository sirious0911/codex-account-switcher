name: P3 V2 Windows SwiftHost observation to R frame

on:
  workflow_dispatch:
  push:
    branches: [feature/provider-extensibility]
    paths:
      - "windows/CodexAccountSwitcher.Core/VerifiedQuotaV2EventBridge.cs"
      - "windows/CodexAccountSwitcher.P3V2EventBridgeChecks/**"
      - ".github/workflows/p3-v2-windows-observer.yml"

permissions:
  contents: read

jobs:
  windows-v2-observer:
    name: Windows verified active monitor V2 frame production
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build full Windows app without deploying it
        shell: pwsh
        run: |
          dotnet build windows/CodexAccountSwitcher/CodexAccountSwitcher.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Windows app build failed' }
      - name: Test SwiftHost event stream to V2 data-only frame
        shell: pwsh
        run: |
          dotnet run --project windows/CodexAccountSwitcher.P3V2EventBridgeChecks -c Release
          if ($LASTEXITCODE -ne 0) { throw 'V2 stream event bridge failed' }
      - name: Verify existing V2 frame schema
        shell: pwsh
        run: |
          dotnet run --project windows/CodexAccountSwitcher.P3V2FrameChecks -c Release
          if ($LASTEXITCODE -ne 0) { throw 'V2 data frame schema failed' }
