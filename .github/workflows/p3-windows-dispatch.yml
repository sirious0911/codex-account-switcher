name: P3 Windows verified quota dispatch

on:
  workflow_dispatch:
  push:
    branches: [feature/provider-extensibility]
    paths:
      - "windows/CodexAccountSwitcher.Core/VerifiedQuotaDispatchCoordinator.cs"
      - "windows/CodexAccountSwitcher.Core/VerifiedQuotaRuntimeBridge.cs"
      - "windows/CodexAccountSwitcher.P3DispatchChecks/**"
      - ".github/workflows/p3-windows-dispatch.yml"

permissions:
  contents: read

jobs:
  verified-dispatch:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile Windows app with fail-closed dispatch adapter
        shell: pwsh
        run: |
          dotnet build windows/CodexAccountSwitcher -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Windows application failed to build' }
      - name: Test verified active profile, cancellation and event bridge
        shell: pwsh
        run: |
          dotnet run --project windows/CodexAccountSwitcher.P3DispatchChecks -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'P3 dispatch regressions failed' }
