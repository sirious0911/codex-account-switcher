name: P3 Windows verified-frame HTTPS interoperability

on:
  workflow_dispatch:
  push:
    branches: [feature/provider-extensibility]
    paths:
      - "windows/CodexAccountSwitcher.P3FrameInterop/**"
      - "shared-authority/transport/windows-verified-frame-relay.e2e.test.mjs"
      - ".github/workflows/p3-windows-frame-interop.yml"

permissions:
  contents: read

jobs:
  frame-to-relay:
    name: Windows .NET frame to Node HTTPS relay
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check ephemeral TLS tool availability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $gitOpenSSL = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
            if (-not (Test-Path -LiteralPath $gitOpenSSL)) {
              throw 'OpenSSL is unavailable for ephemeral loopback TLS test'
            }
            (Split-Path -Parent $gitOpenSSL) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Build real Windows C# active-profile frame producer
        shell: pwsh
        run: dotnet build windows/CodexAccountSwitcher.P3FrameInterop -c Release --nologo
      - name: Verify Windows frame crosses real Node TLS and remains read-only
        shell: pwsh
        run: |
          node --test shared-authority/transport/windows-verified-frame-relay.e2e.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows-to-Node TLS wire integration failed' }
