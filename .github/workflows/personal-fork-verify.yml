name: Personal Fork Verification

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Personal fork branch or commit SHA to verify"
        required: true
        type: string
        default: feature/provider-extensibility

permissions:
  contents: read

jobs:
  swift-macos:
    name: macOS Swift full test suite
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Swift version and full suite
        run: |
          swift --version
          swift test
      - name: Build unsigned local macOS app bundle (no Release publishing)
        run: |
          set -euo pipefail
          ./scripts/package-local-app.sh
          BUNDLE="$(swift build -c release --show-bin-path)/Codex Account Switcher.app"
          test -x "$BUNDLE/Contents/MacOS/CodexAccountSwitcher"
          /usr/bin/plutil -extract SUFeedURL raw -o - "$BUNDLE/Contents/Info.plist" |
            grep -Fx "https://sirious0911.github.io/codex-account-switcher/updates/macos/appcast.xml"
          codesign --verify --deep --strict "$BUNDLE"

  windows-dotnet:
    name: Windows WPF build and synthetic checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check whether Windows Swift host can be built on this runner
        shell: pwsh
        run: |
          $compiler = Get-Command swift -ErrorAction SilentlyContinue
          if ($null -eq $compiler) {
            Write-Host "WINDOWS_SWIFT_NOT_INSTALLED_ON_RUNNER: Swift host not verified."
          } else {
            swift --version
            swift test
          }
      - name: Build Windows native UI
        shell: pwsh
        run: dotnet build windows/CodexAccountSwitcher/CodexAccountSwitcher.csproj -c Release --nologo
      - name: Synthetic native UI checks
        shell: pwsh
        run: dotnet run --project windows/CodexAccountSwitcher.UiChecks -c Release
      - name: Synthetic monitor checks
        shell: pwsh
        run: dotnet run --project windows/CodexAccountSwitcher.MonitorChecks -c Release

  windows-swift:
    name: Native Windows Swift host and core tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}
      - name: Install Swift on ephemeral CI Windows runner
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: '6.4.1'
      - name: Verify native Swift host
        shell: pwsh
        run: |
          swift --version
          swift build -c release --product SwitcherHost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  node-checks:
    name: Node and site regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node regression
        run: node --test scripts/tests/*.test.mjs
      - name: Local site links
        run: node scripts/check-site-geo.mjs
