name: Windows

on:
  pull_request:
    paths:
      - "windows/**"
      - "Sources/SwitcherCore/**"
      - "Sources/SwitcherPlatform/**"
      - "Sources/SwitcherHost/**"
      - "Tests/SwitcherCoreTests/**"
      - "Package.swift"
      - "scripts/package-windows.ps1"
      - "scripts/p020-source-bound-preview.ps1"
      - "scripts/generate-windows-icons.py"
      - "scripts/validate-release-tag.mjs"
      - "scripts/tests/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "Sources/SwitcherCore/**"
      - "Sources/SwitcherPlatform/**"
      - "Sources/SwitcherHost/**"
      - "Tests/SwitcherCoreTests/**"
      - "Package.swift"
      - "scripts/package-windows.ps1"
      - "scripts/p020-source-bound-preview.ps1"
      - "scripts/generate-windows-icons.py"
      - "scripts/validate-release-tag.mjs"
      - "scripts/tests/**"
      - ".github/workflows/windows.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Validate Windows release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          node scripts/validate-release-tag.mjs $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Tag/version mismatch.' }
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main.' }
          $headCommit = git rev-parse HEAD
          $tagCommit = git rev-parse "$($env:GITHUB_REF_NAME)^{commit}"
          if ($headCommit -ne $tagCommit) {
            throw 'Release tag and checkout must point to the same commit.'
          }
      - name: Check release routing
        run: node --test scripts/tests/*.test.mjs
      - name: Build Windows application
        run: dotnet build windows/CodexAccountSwitcher -c Release --nologo
      - name: Check normal close and Store package path refresh
        shell: pwsh
        run: |
          dotnet build windows/CodexAccountSwitcher.CloseFixture -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Desktop close fixture build failed.' }
          dotnet run --project windows/CodexAccountSwitcher.Checks -c Release -- desktop-close "$pwd/windows/CodexAccountSwitcher.CloseFixture/bin/Release/net10.0-windows/ChatGPT.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop close and package update check failed.' }
      - name: Test the same Swift core used by macOS
        shell: pwsh
        run: |
          dotnet build windows/CodexAccountSwitcher.Checks -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Transport fixture build failed.' }
          $env:SWITCHER_TEST_RPC_EXE = Join-Path $pwd 'windows/CodexAccountSwitcher.Checks/bin/Release/net10.0-windows/CodexAccountSwitcher.Checks.exe'
          swift test
      - name: Build the shared core host
        run: swift build -c release --product SwitcherHost
      - name: Check native transport and shared storage with isolated credentials
        shell: pwsh
        run: |
          $bin = swift build -c release --show-bin-path
          if ($LASTEXITCODE -ne 0) { throw 'Shared host path lookup failed.' }
          dotnet run --project windows/CodexAccountSwitcher.Checks -c Release -- "$bin/SwitcherHost.exe"
      - name: Check WPF screens and data bindings with synthetic accounts
        run: dotnet run --project windows/CodexAccountSwitcher.UiChecks -c Release
      - name: Package self-contained EXE
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Verify the EXE without SDK/runtime paths
        shell: pwsh
        run: |
          $start = [Diagnostics.ProcessStartInfo]::new((Join-Path $pwd 'windows/artifacts/Codex-Account-Switcher-windows-x64.exe'), '--self-test')
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.WindowStyle = 'Hidden'
          $start.Environment['PATH'] = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($name in @('CODEX_SWITCHER_HOST_PATH', 'DOTNET_ROOT', 'SDKROOT', 'SWIFT_ROOT', 'SWIFT_PATH')) { $start.Environment.Remove($name) | Out-Null }
          $start.Environment['CODEX_SWITCHER_SELF_TEST_RESULT'] = Join-Path $pwd 'windows/artifacts/package-self-test.txt'
          $process = [Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(45000) -or $process.ExitCode -ne 0) { throw 'Self-contained package check failed.' }
          Get-Content windows/artifacts/package-self-test.txt
      - name: Record isolated SwiftHost runtime provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivePath = Join-Path $pwd 'windows/artifacts/SwiftRuntime.zip'
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw 'Freshly packaged SwiftRuntime.zip was not generated.'
          }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $hostEntries = @($archive.Entries | Where-Object { $_.FullName -ceq 'SwitcherHost.exe' })
            if ($hostEntries.Count -ne 1) { throw 'Runtime must contain exactly one SwitcherHost.exe.' }
            $stream = $hostEntries[0].Open()
            try {
              $hostSha = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash.ToLowerInvariant()
            } finally { $stream.Dispose() }
          } finally { $archive.Dispose() }
          $archiveSha = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $artifactDir = Split-Path -Parent $archivePath
          $encoding = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $artifactDir 'SwiftRuntime.zip.sha256'),
            "$archiveSha  SwiftRuntime.zip" + [Environment]::NewLine, $encoding)
          [IO.File]::WriteAllText((Join-Path $artifactDir 'SwiftHost-source-commit.txt'),
            "source_commit=$env:GITHUB_SHA" + [Environment]::NewLine +
            "swifthost_sha256=$hostSha" + [Environment]::NewLine, $encoding)
      - name: P0-20 Verify fresh SwiftHost and build isolated unsigned P0-18 preview
        shell: pwsh
        run: |
          # Different from windows/artifacts/Codex-Account-Switcher-windows-x64.exe,
          # which is the baseline product. This is the P014 WPF feature candidate.
          $preview = Join-Path $env:RUNNER_TEMP 'p014-step2-unsigned-preview'
          ./scripts/p020-source-bound-preview.ps1 -SourceRoot ((Get-Location).Path) -ExpectedCommit $env:GITHUB_SHA -OutputDirectory $preview
          if ($LASTEXITCODE -ne 0) { throw 'P0-20 unsigned candidate gate failed.' }
          $previewExe = Join-Path $preview 'Codex-Account-Switcher-windows-x64.exe'
          # Exact one-argument WPF test mode has no core, account switch,
          # persistent settings or Sender. Reject a default app mispackaged
          # under the same EXE filename by requiring prompt exit code 0.
          $info = [Diagnostics.ProcessStartInfo]::new($previewExe, '--step2-settings-no-send')
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
          $process = [Diagnostics.Process]::Start($info)
          if ($null -eq $process) { throw 'P014 preview could not launch.' }
          try {
            if (-not $process.WaitForExit(20000)) {
              $process.Kill($true)
              throw 'HOLD_P014_READONLY_PREVIEW_DID_NOT_EXIT'
            }
            if ($process.ExitCode -ne 0) {
              throw 'HOLD_P014_READONLY_PREVIEW_EXIT_NONZERO'
            }
          } finally { $process.Dispose() }
          $sha = (Get-FileHash -LiteralPath $previewExe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            (Join-Path $env:RUNNER_TEMP 'P014-Step2-Unsigned-Preview.sha256'),
            "$sha  Codex-Account-Switcher-windows-x64.exe" + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false))
          # Synthetic WPF integration remains required. This unsigned
          # executable is a non-release review candidate, never installed.
          # A new command must be exercised in the freshly compiled Windows
          # SwiftHost itself, not inferred from a previously built donor zip
          # or from the C# offline synthetic envelope checks alone.
          $nativeBin = swift build -c release --show-bin-path
          if ($LASTEXITCODE -ne 0) { throw 'HOLD_FRESH_SWIFTHOST_BIN_PATH' }
          $nativeHost = Join-Path $nativeBin.Trim() 'SwitcherHost.exe'
          if (-not (Test-Path -LiteralPath $nativeHost -PathType Leaf)) {
            throw 'HOLD_FRESH_SWIFTHOST_EXE_NOT_FOUND'
          }
          Push-Location windows/P014WpfSource/dedicated-thread-v72-native-20261119
          try {
            dotnet run --project IntegratedChecks/IntegratedChecks.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw 'P0-20 synthetic WPF checks failed.' }
            # Temp-only synthetic auth + local fake Codex CLI. Prove both
            # 5H and 7D observations from TWO real native refreshActive reads.
            # On any missing/invalid response, fail CI before artifact upload.
            dotnet run --project IntegratedChecks/IntegratedChecks.csproj -c Release -- --native-swift-host-refresh-no-send $nativeHost
            if ($LASTEXITCODE -ne 0) {
              throw 'HOLD_FRESH_WINDOWS_SWIFTHOST_ACTIVE_QUOTA_IPC'
            }
          } finally { Pop-Location }
      - name: P0-21 Verify protected trust-source reader (synthetic, no send)
        shell: pwsh
        run: |
          $project = 'windows/CodexAccountSwitcher.TrustSource/CodexAccountSwitcher.TrustSource.csproj'
          dotnet run --project $project -c Release -- --synthetic-acl-checks
          if ($LASTEXITCODE -ne 0) { throw 'P0-21 protected trust ACL checks failed.' }
          dotnet run --project $project -c Release -- --synthetic-relative-head-checks
          if ($LASTEXITCODE -ne 0) { throw 'P0-21 handle-relative HEAD checks failed.' }
          # No administrator policy registration, signed HEAD installation,
          # account access or Owner/Sender messaging is performed.
      - name: Upload isolated native SwiftHost runtime
        uses: actions/upload-artifact@v4
        with:
          name: Codex-SwitcherHost-runtime-windows-x64
          path: |
            windows/artifacts/SwiftRuntime.zip
            windows/artifacts/SwiftRuntime.zip.sha256
            windows/artifacts/SwiftHost-source-commit.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload P014 Windows STEP2 unsigned no-send candidate (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: P014-Windows-STEP2-NO-SEND-UNSIGNED-TEST-ONLY
          path: |
            ${{ runner.temp }}/p014-step2-unsigned-preview/Codex-Account-Switcher-windows-x64.exe
            ${{ runner.temp }}/P014-Step2-Unsigned-Preview.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Account-Switcher-windows-x64
          path: |
            windows/artifacts/*.exe
            windows/artifacts/*.sha256
          if-no-files-found: error
